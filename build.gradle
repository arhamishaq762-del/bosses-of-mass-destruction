plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version + '-' + project.minecraft_version
group = project.maven_group

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

// Minecraft 26.1 is unobfuscated. Do not add Yarn or remapped mod configurations.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
kotlin {
    jvmToolchain(25)
    compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
}

configurations {
    embeddedComponents {
        transitive = false
    }
}

// The Modrinth CCA distribution contains its API modules as nested jars.
// Expose those to javac/Kotlin without bundling a second copy in BOMD.
def extractComponents = tasks.register('extractComponentCompileJars', Sync) {
    from({ configurations.embeddedComponents.collect { zipTree(it) } }) {
        include 'META-INF/jars/*.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('component-compile-jars')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    implementation "maven.modrinth:geckolib:${project.geckolib_version}"
    implementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
    implementation "maven.modrinth:cardinal-components-api:${project.cardinal_components_version}"
    embeddedComponents "maven.modrinth:cardinal-components-api:${project.cardinal_components_version}"
    implementation files(fileTree(layout.buildDirectory.dir('component-compile-jars')) {
        include '*.jar'
    }).builtBy(extractComponents)
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    runtimeOnly "maven.modrinth:modmenu:${project.modmenu_version}"

    // Diagnostic builds can use an explicitly supplied legacy API jar.
    // It is compile-only: shipping the 1.21 MultipartEntities binary on 26.1 is unsafe.
    if (providers.gradleProperty('legacyMultipartJar').isPresent()) {
        compileOnly files(providers.gradleProperty('legacyMultipartJar').get())
    }

    testImplementation "org.assertj:assertj-core:${project.junit_core_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${project.junit_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${project.junit_version}"
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${project.junit_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

test {
    useJUnitPlatform()
}

jar {
    from 'LICENSE'
}
